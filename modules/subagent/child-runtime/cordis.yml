# subagent-at 子运行时组合（v1）。
#
# 基础：宿主 `examples/jsonrpc-agent/cordis.yml`（无值守 JSON-RPC 编码代理
# 部署）。在其之上做了一处关键追加：`agent-instructions`——没有它子代理
# 不会加载目标目录的 AGENTS.md/CLAUDE.md，本插件的核心卖点就不成立
# （背景见 ../docs/child-runtime.md 的 ⚠️ 节）。
#
# 约束继承：
# - stdout 专属 JSON-RPC 协议：不要加 console logger / 终端 UI。
# - 工作区不在这里配置：父端按调用把进程拉起在目标目录（进程 cwd 即
#   目标目录），`DSH_CWD` 缺省时 bash/fs-local 的 `process.cwd()` 回落
#   自动命中目标目录；SDK 会话的工作区 cwd 由父端写入。
# - 会话持久化默认落在 `./.sessions`（= 目标目录内）；不想污染目标目录
#   就在父端插件 `env` 里传 `DSH_SESSION_ROOT`。
#
# 扩展方向（按需追加）：
# - skills：挂 `@deepseek-ai/dsh-skill` + `dsh-skill-filesystem`，并把
#   spine 的 `skills.enabled` 打开（宿主 base bundle 的挂法为准）；
# - 其它工具/扩展同理——子运行时就是一个完整 dsh 部署。

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

# The DeepSeek adapter. The model arrives per session over JSON-RPC (the
# parent plugin's `provider` / `model` config), so it is not pinned here.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

# 凭证：子运行时自己解析 `DEEPSEEK_API_KEY` 凭证引用（credential seam）。
# 父端 scrubbedParentEnv 会剥掉凭证形状的环境名与全部 DSH_*，但 homedir
# 存活 → 默认 $DSH_HOME（~/.dsh）与父端同址，读到同一份 .credentials.yaml。
# 不挂它，子运行时没有模型凭证。
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

# agent-instructions 这里默认不挂（省 token）：子端是全新进程、上下文
# 不继承父端（inheritsParentContext=false），父会话加载的 AGENTS.md
# 不会传给子端——子端要遵循目标目录的入口文件，只能靠它自己的
# agent-instructions（不存在「父端已加载、子端再挂会 double injection」）。
# 当目标目录 ≠ 父会话工作区、需要子端独立加载目标目录的指令时，
# 在这里加回 agent-instructions；目标目录 = 父工作区时挂它只是重复读
# 同一份文件（token 冗余），按需取舍。

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
