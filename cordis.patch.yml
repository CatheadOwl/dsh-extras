# @catheadowl/dsh-extras — one row per module, added by `- insert:`.
# Row names: package subpath specifiers (@catheadowl/dsh-extras/<module>) for
# the four published modules — each is a public contract (package.json
# `exports` must declare the same subpath; see plugin-release 03/05).
# The subagent row is WITHHELD again as of 0.1.1: its runtime peer
# @deepseek-ai/dsh-sdk-client is published on npm yet absent from every dsh
# CLI installation closure (verified against the latest 0.1.1-rc.2 and alpha
# 0.1.2-alpha.5 dependency manifests), so the row's import kills the whole
# plugin tree for registry consumers (0.1.0 lesson, verified by clean-install
# smoke). Revisit when the host ships dsh-sdk-client in the install closure.
- insert:
    - id: gates
      name: '@catheadowl/dsh-extras/gates'
      config:
        maxConsecutiveBlocks: 3
    - id: markdown
      name: '@catheadowl/dsh-extras/markdown'
    - id: prompt
      name: '@catheadowl/dsh-extras/prompt'
      config:
        providerTimeoutMs: 2000
        totalTimeoutMs: 5000
        renderBudgetChars: 4000
    - id: routes
      name: '@catheadowl/dsh-extras/routes'
    - id: extras-client
      name: './modules/client/lib/index.js'
