# @catheadowl/dsh-extras — one row per module, added by `- insert:`.
# Row names are relative specifiers anchored at this file's directory.
- insert:
    - id: gates
      name: './modules/gates/lib/index.js'
      config:
        maxConsecutiveBlocks: 3
    - id: md
      name: './modules/md/lib/index.js'
    - id: prompt
      name: './modules/prompt/lib/index.js'
      config:
        providerTimeoutMs: 2000
        totalTimeoutMs: 5000
        renderBudgetChars: 4000
    - id: routes
      name: './modules/routes/lib/index.js'
    - id: subagent-at
      name: './modules/subagent/lib/index.js'
    - id: extras-client
      name: './modules/client/lib/index.js'
