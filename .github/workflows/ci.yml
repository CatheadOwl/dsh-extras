# CI for @catheadowl/dsh-extras
#
# Tier-A pipeline only: verify gates + bilingual README pairing, green on a
# clean clone with `pnpm i` and no dsh host checkout. Build (tsc/tsdown), the
# type closure, and the client-bundle preset form Tier B and are deferred:
# the host dev surface (types package, client-bundle preset) has no npm
# publication yet (upstream proposal "host dev surface publication"; see the
# dsh-extra control repo's workunits/github-release note "CI 分层与暂缓决策").
# Until that lands, build + per-module tests are verified locally against a
# host checkout, not in CI. The commented steps below are that deferred tail:
#   - run: pnpm build
#   - run: pnpm test:gates && pnpm test:markdown && pnpm test:prompt && pnpm test:routes
#   - run: pnpm verify:package-face
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      # Release hygiene + bilingual README pairing (no host checkout needed):
      - run: pnpm verify:publish-readiness
      - run: pnpm verify:readme-i18n
